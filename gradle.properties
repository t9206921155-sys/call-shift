# JVM / Gradle tuning (важно для машин с 2–4 ГБ ОЗУ и для CI)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configureondemand=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

kotlin.code.style=official
kotlin.incremental=true

# Кодировка имён файлов JVM (защита от Malformed input в именах тестов/классов)
systemProp.sun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8

# Память Kotlin-демона: на машинах с 2 ГБ ОЗУ без этого R8+dexing уходит в OOM
kotlin.daemon.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=320m

android.suppressUnsupportedCompileSdk=35
